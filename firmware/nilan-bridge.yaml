# Legacy ESPHome alternative; see reliable/README.md for dual USB/Wi-Fi recovery.
# ESPHome: Nilan CTS600 — transparent RAW Serial<->TCP Tunnel
# Board: Waveshare ESP32-S3-RS485-CAN (RS-485 transceiver onboard + isolated)
# Role: WLAN<->RS-485 bytes 1:1. No Modbus interpretation on the ESP.
# Panel emulation runs server-side via frodef/nilan-daemon.
substitutions:
  tcp_port: "6638"
esphome:
  name: nilan-bridge
  friendly_name: Nilan CTS600 Bridge
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
logger:
  hardware_uart: USB_SERIAL_JTAG
api:
  # No native API consumer is required for the raw tunnel. Do not reboot every
  # 15 minutes just because a Home Assistant client is absent.
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # Preserve fallback access during an AP outage; no whole-device reboot loop.
  reboot_timeout: 0s
  # Static IP is recommended because tj-lt socat connects to this endpoint.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "Nilan-Bridge Setup"
    password: !secret ap_password
captive_portal:
web_server:
  port: 80
  auth:
    username: admin
    password: !secret ota_password
external_components:
  - source: github://oxan/esphome-stream-server@9e05b0a3fea78a0ab7c11338327e5492f0c95b43
uart:
  id: nilan_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  flow_control_pin: GPIO21
  baud_rate: 19200
  data_bits: 8
  # The unit sends 8N1. Older UART cores tolerated a second stop-bit setting;
  # newer ones reject/mangle replies. Live frame/readback checks confirm 8N1.
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512
stream_server:
  uart_id: nilan_uart
  port: ${tcp_port}
  buffer_size: 1024
binary_sensor:
  - platform: status
    name: "Nilan Bridge Status"
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Nilan Bridge IP"
